name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *" # daily, so new advisories surface without a push

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --deny warnings

  isolation-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bp_sectest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Superuser URL: the tests create their own NOBYPASSRLS app role from it.
      BP_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bp_sectest
      BP_TEST_REQUIRE_DB: "1" # a missing database fails the job instead of skipping
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: workspace tests
        run: cargo test --workspace --locked
      - name: security regression suite
        run: cargo test -p bp-ent-sectest --locked -- --include-ignored

  web-supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust SBOM (CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --all
      - name: Web SBOM (CycloneDX)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../web.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            **/*.cdx.json
          retention-days: 90

  iac-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: IaC and container misconfiguration scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
