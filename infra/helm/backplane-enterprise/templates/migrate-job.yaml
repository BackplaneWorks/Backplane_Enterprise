{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bp-ent.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "bp-ent.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "bp-ent.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "bp-ent.fullname" . }}-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.api.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            # ONLY the migrate job receives DATABASE_ADMIN_URL and BP_APP_DB_PASSWORD.
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bp-ent.secretName" . }}
                  key: databaseAdminUrl
            - name: BP_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bp-ent.secretName" . }}
                  key: databaseAppPassword
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "bp-ent.fullname" . }}-config
                  key: RUST_LOG
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
