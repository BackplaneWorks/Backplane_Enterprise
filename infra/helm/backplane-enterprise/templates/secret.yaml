{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bp-ent.secretName" . }}
  labels:
    {{- include "bp-ent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mounted ONLY into api and relay (non-owner bp_app role, NOBYPASSRLS).
  databaseAppUrl: {{ .Values.secrets.databaseAppUrl | quote }}
  # Mounted ONLY into the pre-install/pre-upgrade migrate Job.
  databaseAdminUrl: {{ .Values.secrets.databaseAdminUrl | quote }}
  databaseAppPassword: {{ .Values.secrets.databaseAppPassword | quote }}
  bpKek: {{ .Values.secrets.bpKek | quote }}
  ca.crt: {{ .Values.secrets.boatCaCertPem | quote }}
  ca.key: {{ .Values.secrets.boatCaKeyPem | quote }}
  s3AccessKey: {{ .Values.secrets.s3AccessKey | quote }}
  s3SecretKey: {{ .Values.secrets.s3SecretKey | quote }}
  stripeSecretKey: {{ .Values.secrets.stripeSecretKey | quote }}
  stripeWebhookSecret: {{ .Values.secrets.stripeWebhookSecret | quote }}
  googleMailClientSecret: {{ .Values.secrets.googleMailClientSecret | quote }}
  microsoftMailClientSecret: {{ .Values.secrets.microsoftMailClientSecret | quote }}
{{- end }}
