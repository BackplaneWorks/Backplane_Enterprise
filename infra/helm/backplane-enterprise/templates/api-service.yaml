apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-ent.fullname" . }}-api
  labels:
    {{- include "bp-ent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
{{- if .Values.relay.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-ent.fullname" . }}-relay-mtls
  labels:
    {{- include "bp-ent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.mtlsServiceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.mtlsServiceType }}
  ports:
    - name: boat-mtls
      port: {{ .Values.api.mtlsPort }}
      targetPort: boat-mtls
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
{{- end }}
