[package]
name = "bp-ent-core"
description = "Backplane Enterprise shared kernel: domain types, RBAC, tenant-scoped DB access, KMS envelope crypto, audit hash chain, LLM/approval policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# AWS KMS key provider (production on AWS). Self-host uses the local KEK.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
# Test database helper (fresh database per test).
testkit = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
aes-gcm.workspace = true
base64.workspace = true
hex.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
aws-config = { version = "1", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }

[dev-dependencies]
tower.workspace = true

[[test]]
name = "db"
required-features = ["testkit"]
