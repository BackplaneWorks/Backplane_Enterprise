[package]
name = "bp-ent-relay"
description = "Backplane Enterprise Zero-Tailscale outbound mTLS Boat VM relay, device CA, and VM lifecycle/metering service."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bp-ent-relay"
path = "src/main.rs"

[dependencies]
bp-ent-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
http-body-util = "0.1"
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
webpki-roots = "1"
zeroize.workspace = true

# Pure-Rust TLS 1.3 + mTLS + X.509 device CA (zero OpenSSL / native-tls).
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "service"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.16"

[dev-dependencies]
bp-ent-core = { path = "../bp-ent-core", features = ["testkit"] }
